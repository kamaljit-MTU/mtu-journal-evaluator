<!DOCTYPE html>
<html>
<head>
    <title>Login - MTU Journal Evaluator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 4em auto; background: #f5f5f5; }
        .container { background: white; padding: 2em; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a5276; }
        label { display: block; margin: 1em 0 0.3em; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.5em; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #1a5276; color: white; border: none; padding: 0.7em 1.5em; border-radius: 4px; cursor: pointer; margin-top: 1em; font-size: 1em; }
        .error { color: #c0392b; margin-top: 1em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MTU Journal Evaluator</h1>
        <p>Please log in to continue.</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login">
            <label>Username</label>
            <input type="text" name="username" required autofocus>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
