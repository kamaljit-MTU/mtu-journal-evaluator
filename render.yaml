# Render.com Deployment Configuration
# Free tier includes: 512 MB RAM, 100 GB bandwidth, PostgreSQL database

services:
  - type: web
    name: mtu-journal-evaluator
    runtime: docker
    plan: free
    branch: main
    rootDir: .
    buildCommand: docker build -t mtu-journal-evaluator .
    startCommand: gunicorn src.api_v2:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mtu-journal-db
          property: connectionString
      - key: DEBUG
        value: "false"

databases:
  - name: mtu-journal-db
    plan: free
    databaseName: mtu_journal_evaluator
    user: mtu_admin
